<title>TradeUp</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
<style>
/* Disposición: app de bróker para móvil. Marca arriba, valor de la cartera y gráfico, tarjetas de secciones,
   cuatro pestañas abajo y pantallas de detalle a pantalla completa. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#0C0F16; --muted:#667085; --faint:#A0A8B8; --line:#E6E9F0; --chip:#ECEEF4;
  --brand:#4A1B7F; --brand-soft:rgba(74,27,127,.09); --on-brand:#FFFFFF; --gold:#B8891A;
  --up:#0A8F5B; --down:#D43B3B; --up-bg:rgba(10,143,91,.10); --down-bg:rgba(212,59,59,.10);
  --oro1:#F0C24B; --oro2:#C98F1E; --tsla:#5B4BDB; --nvda:#0E9AA7;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --fd:"Sora","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#080A10; --surface:#12151E; --ink:#F2F4F9; --muted:#8C95A9; --faint:#586074; --line:#1E2330; --chip:#1A1E2A;
  --brand:#BBA3FF; --brand-soft:rgba(187,163,255,.15); --on-brand:#1B0633; --gold:#E6BD3F;
  --up:#33D296; --down:#FF6B6B; --up-bg:rgba(51,210,150,.13); --down-bg:rgba(255,107,107,.13);
  --oro1:#F0C24B; --oro2:#C98F1E; --tsla:#7466F0; --nvda:#17B3C1; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#080A10; --surface:#12151E; --ink:#F2F4F9; --muted:#8C95A9; --faint:#586074; --line:#1E2330; --chip:#1A1E2A;
  --brand:#BBA3FF; --brand-soft:rgba(187,163,255,.15); --on-brand:#1B0633; --gold:#E6BD3F;
  --up:#33D296; --down:#FF6B6B; --up-bg:rgba(51,210,150,.13); --down-bg:rgba(255,107,107,.13);
  --oro1:#F0C24B; --oro2:#C98F1E; --tsla:#7466F0; --nvda:#17B3C1; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:12px}
.col{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{padding-block:6px 104px;min-height:100%}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}

/* Marca */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 8px}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;display:block;flex:none}
.word{font-family:var(--fd);font-weight:800;font-size:19.5px;letter-spacing:-.035em;font-style:italic}
.word b{color:var(--gold);font-weight:800}
.demo{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-left:2px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px}

/* Valor y gráfico */
.val{padding:14px 0 0}
.val .lbl{font-size:13px;color:var(--muted);font-weight:500}
.val .amt{font-family:var(--fd);font-size:clamp(34px,10.5vw,44px);font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-top:2px}
.val .chg{margin-top:8px;font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:26px}
.badge{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;padding:4px 8px;border-radius:8px}
.badge.up{background:var(--up-bg)} .badge.down{background:var(--down-bg)} .badge.muted{background:var(--chip)}
.val .when{color:var(--muted);font-weight:500}
.chart{margin:12px -6px 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:auto}
.ranges{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin-top:8px}
.ranges button{flex:1;text-align:center;padding:7px 0;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.ranges button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Tarjetas y filas */
.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px}
.sec-h h2{font-family:var(--fd);font-size:17px;font-weight:700;margin:0;letter-spacing:-.02em}
.sec-h button{font-size:13.5px;font-weight:600;color:var(--brand)}
.card{background:var(--surface);border-radius:18px;padding:2px 14px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:-.01em;flex:none;color:#fff;background:var(--faint)}
.ic.MGC{background:linear-gradient(140deg,var(--oro1),var(--oro2));color:#3A2A05;font-size:14px}
.ic.TSLA{background:var(--tsla)} .ic.NVDA{background:var(--nvda)}
.ic.cash{background:var(--brand-soft);color:var(--brand)}
.ic svg{width:23px;height:23px;display:block}
.ic.cash svg{width:20px;height:20px}
.hero .ic svg{width:28px;height:28px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px}
.row .r{text-align:right;flex:none}
.row .r b{display:block;font-weight:700;font-size:15px}
.row .r span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.row .r span.up{color:var(--up)} .row .r span.down{color:var(--down)}
.row .spark{width:58px;height:26px;flex:none;display:block}
.empty{padding:16px 2px;color:var(--muted);font-size:14px}
.daylbl{font-size:13px;font-weight:600;color:var(--muted);padding:18px 4px 8px;display:flex;justify-content:space-between;gap:10px}
.daylbl span:first-child{display:inline-block}
.daylbl span:first-child::first-letter{text-transform:uppercase}
.h1{font-family:var(--fd);font-size:25px;font-weight:700;letter-spacing:-.03em;margin:10px 2px 0}
.sub{font-size:13.5px;color:var(--muted);margin:4px 2px 0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -2px 0;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.more{display:block;width:100%;text-align:center;margin-top:12px;padding:13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--brand)}
.pct{display:inline-block !important;font-size:12.5px !important;font-weight:700;padding:2px 7px;border-radius:7px}
.pct.up{background:var(--up-bg);color:var(--up) !important} .pct.down{background:var(--down-bg);color:var(--down) !important} .pct.muted{background:var(--chip)}

/* Cuenta */
.who{display:flex;align-items:center;gap:14px;margin-top:14px}
.who .avatar{width:56px;height:56px;font-size:21px}
.who b{font-family:var(--fd);font-size:19px;letter-spacing:-.02em;display:block}
.who span{font-size:13.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:-.02em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex:none;max-width:60%}
.kv span:last-child{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.txt{font-size:14px;color:var(--muted);margin:10px 2px 0;max-width:60ch}
.txt b{color:var(--ink);font-weight:600}

/* Barra inferior */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--faint)}
.tabbar button[aria-selected="true"]{color:var(--brand)}
.tabbar svg{width:23px;height:23px;display:block}

/* Pantalla de detalle */
.screen{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;animation:in .18s ease-out}
@keyframes in{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.screen .col{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.nav{display:flex;align-items:center;gap:8px;padding:8px 0 4px;min-height:52px}
.backb{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.backb svg{width:20px;height:20px}
.nav .ttl{font-weight:600;font-size:15px;color:var(--muted);flex:1;text-align:center;margin-right:38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .ttl::first-letter{text-transform:uppercase}
.hero{display:flex;align-items:center;gap:12px;margin-top:10px}
.hero .ic{width:48px;height:48px;font-size:13px}
.hero .ic.MGC{font-size:16px}
.hero b{font-family:var(--fd);font-size:21px;letter-spacing:-.02em;display:block}
.hero span{font-size:13.5px;color:var(--muted)}
.hero span.ic{color:#fff;font-size:13px}
.hero span.ic.MGC{color:#3A2A05}
.hero span.ic.cash{color:var(--brand)}
.bigv{font-family:var(--fd);font-size:34px;font-weight:700;letter-spacing:-.04em;margin-top:16px;line-height:1.1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--up);background:var(--up-bg);padding:5px 10px;border-radius:999px;margin-top:12px}
.status svg{width:14px;height:14px}
.skel{display:inline-block;height:40px;width:200px;border-radius:10px;background:var(--chip)}
</style>

      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="tu-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4E1C86"/><stop offset="1" stop-color="#22063D"/></linearGradient><linearGradient id="tu-au" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0C840"/><stop offset="1" stop-color="#C9981A"/></linearGradient></defs><rect width="512" height="512" rx="150" fill="url(#tu-bg)"/><g transform="translate(256 256) scale(1.2) translate(-256 -256)"><g transform="translate(-17 -3)"><rect x="141" y="250" width="10" height="140" rx="5" fill="url(#tu-au)"/><rect x="122" y="278" width="48" height="86" rx="7" fill="url(#tu-au)"/><rect x="209" y="206" width="10" height="158" rx="5" fill="#fff"/><rect x="190" y="234" width="48" height="100" rx="7" fill="#fff"/><rect x="270" y="332" width="26" height="24" rx="4" fill="url(#tu-au)"/><rect x="302" y="321" width="26" height="35" rx="4" fill="url(#tu-au)"/><rect x="334" y="300" width="26" height="56" rx="4" fill="url(#tu-au)"/><rect x="366" y="258" width="26" height="98" rx="4" fill="url(#tu-au)"/><path d="M262 318C320 314 372 280 398 176" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/><path d="M409 128 426 186 370 172z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></g></g></svg>
      <span class="word">Trade<b>UP</b></span><span class="demo">Prototipo</span>
